# /etc/omni-enrollment/config.yaml — optional; flags and OMNI_ENROLLMENT_* env
# override these values.
issuer: https://identity.example
# client_id: omni-enrollment
# state_dir: /var/lib/omni-enrollment
# runtime_dir: /run/omni-enrollment
# name: omni-laptop
# ca_file: /etc/omni-enrollment/ca.pem
# allow_insecure_http: false   # private-network testing only
# qr: dark            # QR code under sign-in links on consoles/SSH: dark (default) | light | off
# qr_greeters: false  # also send the QR text to graphical greeters (GDM, SDDM, LightDM); best effort
# offline_validity: 168h
# login_shell: /bin/bash
# broker_audiences: [omni-metrics, omni-logging]   # local token broker; empty = off
# key_backend: file          # file (default) | tpm — where the device key lives
# tpm_device: /dev/tpmrm0    # for key_backend tpm; or tcp://host:port (software TPM)
