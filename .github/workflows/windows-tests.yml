name: Windows tests
# Runs the enrollment engine's Windows-relevant tests on a real Windows
# runner. Manual only (hosted Windows minutes cost double): start it from
# the Actions tab after touching Windows-specific code. Every push already
# cross-compiles and vets for Windows from Linux in the CI/CD workflow.
on:
  workflow_dispatch:

jobs:
  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./cmd/omni-enrollment
      # The enrollment suite as a whole assumes Linux (PAM, NSS, file modes,
      # home directories); on Windows run the key store, broker uid and
      # proof-of-possession tests, which is what the Windows agent depends on.
      - run: go test ./internal/pop/... && go test ./internal/enrollment/ -run 'Key|Windows'
        env:
          CGO_ENABLED: "0"
